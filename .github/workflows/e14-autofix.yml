name: E1.4 one-time autofix

on:
  push:
    branches:
      - build/e1-asr-h2-h3

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: build/e1-asr-h2-h3
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply deterministic Ruff fixes and formatting
        run: |
          ruff check --fix .
          ruff format .

      - name: Commit formatting-only changes when required
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(asr): apply deterministic Ruff formatting [skip ci]"
          git push origin HEAD:build/e1-asr-h2-h3
