name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run supported deterministic quality sequence
        run: bash scripts/run_quality_checks.sh

      - name: Prove validation did not mutate tracked evidence
        run: git diff --exit-code

      - name: Prove validation left no untracked artifacts
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
