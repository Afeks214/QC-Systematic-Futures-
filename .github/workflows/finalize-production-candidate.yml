name: Finalize production-candidate repository

on:
  push:
    branches:
      - build/production-candidate-v2
    paths:
      - .release/FINALIZE

permissions:
  contents: write

jobs:
  validate-promote-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify production-candidate architecture is present
        shell: bash
        run: |
          set -euo pipefail
          test -d systematic_futures/models
          test -f systematic_futures/forecast.py
          test -f systematic_futures/portfolio.py
          test -f systematic_futures/risk.py
          test -d systematic_futures/execution
          test -d systematic_futures/qc_adapters
          test -f README.md
          test -f ARCHITECTURE.md
          test -f AGENTS.md
          grep -Eiq 'forecast|forecasting' ARCHITECTURE.md
          grep -Eiq 'portfolio' ARCHITECTURE.md
          grep -Eiq 'risk' ARCHITECTURE.md
          grep -Eiq 'execution' ARCHITECTURE.md
          grep -Eiq 'production-candidate|production candidate' README.md
          if find systematic_futures -type f -name '*.py' -print0 | xargs -0 grep -nE '^[[:space:]]*(pass|TODO|FIXME)([[:space:]]|$)' ; then
            echo 'Unresolved production-path placeholder found' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(\.bootstrap|\.release)/|\.zip$|chunk-[0-9]+' ; then
            echo 'Temporary payload material is still tracked' >&2
            exit 1
          fi

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run deterministic quality gate
        run: bash scripts/run_quality_checks.sh

      - name: Run production-path smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          collected=$(python -m pytest --collect-only -q | awk '/tests collected/{print $1}' | tail -1)
          test -n "${collected:-}"
          test "$collected" -ge 200

      - name: Prove validation left repository clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Remove one-time release machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .release
          rm -f .github/workflows/apply-production-candidate.yml
          rm -f .github/workflows/finalize-production-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time repository bootstrap"
          fi

      - name: Promote validated source to main by fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main

      - name: Delete every non-main remote branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -vE '^(HEAD|main)$' \
              | sort -u
          )
          for branch in "${branches[@]}"; do
            echo "Deleting remote branch: $branch"
            git push origin --delete "$branch"
          done

      - name: Verify canonical repository state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          remaining=$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          test "$remaining" = "main"
          echo "CANONICAL_MAIN_SHA=$(git rev-parse HEAD)"