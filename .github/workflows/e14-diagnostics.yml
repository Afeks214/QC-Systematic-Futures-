name: E1.4 one-time diagnostics

on:
  push:
    branches:
      - build/e1-asr-h2-h3

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run quality and capture complete log
        id: quality
        shell: bash
        run: |
          set +e
          bash scripts/run_quality_checks.sh 2>&1 | tee e14-quality.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: e14-quality-log
          path: e14-quality.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve quality failure status
        if: steps.quality.outputs.exit_code != '0'
        run: exit 1
