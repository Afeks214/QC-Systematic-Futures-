name: E1.4 one-time source snapshot

on:
  push:
    branches:
      - build/e1-asr-h2-h3

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: e14-source-snapshot
          path: |
            .github
            systematic_futures
            tests
            scripts
            main.py
            pyproject.toml
            requirements.txt
            research.ipynb
            research_notebooks
            README.md
            AGENTS.md
            ARCHITECTURE.md
            docs
          if-no-files-found: error
          retention-days: 1
