name: Apply production-candidate payload

on:
  push:
    branches:
      - build/production-candidate-v2
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Reconstruct production-candidate source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 --decode > /tmp/production-candidate.zip
          unzip -oq /tmp/production-candidate.zip -d .
          rm -rf .bootstrap

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic quality gate
        run: bash scripts/run_quality_checks.sh

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete v2 production-candidate platform"
          git push origin HEAD:build/production-candidate-v2
