[project]
name = "systematic-futures-measurement"
version = "0.2.0"
description = "Deterministic point-in-time futures auction-state measurement"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "analytic_math: hand-calculated mathematical oracle",
    "differential_math: independent implementation comparison",
    "metamorphic_math: invariant-preserving input transformation",
    "causality_math: prefix and prior-only equivalence",
    "stress_math: degenerate, boundary, or numerical stress case",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb", "upload", ".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "PTH", "RUF"]
ignore = ["A005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["systematic_futures", "scripts"]
exclude = ["systematic_futures/qc_adapters"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportPrivateUsage = "none"
reportUnnecessaryIsInstance = "none"
